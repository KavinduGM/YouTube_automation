# Dokploy injects env vars from the Environment tab as SHELL variables
# at the time it runs `docker compose up`. We then expand them per service
# via ${VAR} interpolation. No YAML anchors (Dokploy's preprocessor may
# not expand them correctly).

services:
  migrator:
    build: .
    command:
      - "sh"
      - "-c"
      - |
        echo '======== ENV DUMP (migrator) ========'
        env | sort | grep -v -E '^(_|HOME|HOSTNAME|PATH|PWD|SHLVL|TERM|NODE_VERSION|YARN_VERSION)='
        echo '======== END ENV DUMP ========'
        npx prisma db push --accept-data-loss --skip-generate
    environment:
      NODE_ENV: ${NODE_ENV}
      TZ: ${TZ}
      DASHBOARD_URL: ${DASHBOARD_URL}
      API_URL: ${API_URL}
      API_PORT: ${API_PORT}
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      ALLOWED_APPROVER_EMAILS: ${ALLOWED_APPROVER_EMAILS}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      DRIVE_POLL_INTERVAL_SECONDS: ${DRIVE_POLL_INTERVAL_SECONDS}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS}
      TMP_DIR: ${TMP_DIR}
      LOG_LEVEL: ${LOG_LEVEL}
    networks: [dokploy-network, default]
    restart: "no"

  api:
    build: .
    command:
      - "sh"
      - "-c"
      - |
        echo '======== ENV DUMP (api) ========'
        env | sort | grep -v -E '^(_|HOME|HOSTNAME|PATH|PWD|SHLVL|TERM|NODE_VERSION|YARN_VERSION)='
        echo '======== END ENV DUMP ========'
        node apps/api/dist/index.js
    environment:
      NODE_ENV: ${NODE_ENV}
      TZ: ${TZ}
      DASHBOARD_URL: ${DASHBOARD_URL}
      API_URL: ${API_URL}
      API_PORT: ${API_PORT}
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      ALLOWED_APPROVER_EMAILS: ${ALLOWED_APPROVER_EMAILS}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      DRIVE_POLL_INTERVAL_SECONDS: ${DRIVE_POLL_INTERVAL_SECONDS}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS}
      TMP_DIR: ${TMP_DIR}
      LOG_LEVEL: ${LOG_LEVEL}
    networks: [dokploy-network, default]
    expose:
      - "4000"
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "apps/worker/dist/index.js"]
    environment:
      NODE_ENV: ${NODE_ENV}
      TZ: ${TZ}
      DASHBOARD_URL: ${DASHBOARD_URL}
      API_URL: ${API_URL}
      API_PORT: ${API_PORT}
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      ALLOWED_APPROVER_EMAILS: ${ALLOWED_APPROVER_EMAILS}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      DRIVE_POLL_INTERVAL_SECONDS: ${DRIVE_POLL_INTERVAL_SECONDS}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS}
      TMP_DIR: ${TMP_DIR}
      LOG_LEVEL: ${LOG_LEVEL}
    networks: [dokploy-network, default]
    volumes:
      - workertmp:/app/tmp
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  dashboard:
    build: .
    working_dir: /app/apps/dashboard
    command: ["node", "/app/node_modules/next/dist/bin/next", "start", "-p", "3000"]
    environment:
      NODE_ENV: ${NODE_ENV}
      TZ: ${TZ}
      DASHBOARD_URL: ${DASHBOARD_URL}
      API_URL: ${API_URL}
      API_PORT: ${API_PORT}
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      ALLOWED_APPROVER_EMAILS: ${ALLOWED_APPROVER_EMAILS}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      DRIVE_POLL_INTERVAL_SECONDS: ${DRIVE_POLL_INTERVAL_SECONDS}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS}
      TMP_DIR: ${TMP_DIR}
      LOG_LEVEL: ${LOG_LEVEL}
    networks: [dokploy-network, default]
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

networks:
  # Dokploy's cross-project Swarm overlay — Postgres lives here.
  dokploy-network:
    external: true
  # Local bridge so api/worker/dashboard can resolve each other by service name.
  default:
    driver: bridge

volumes:
  workertmp:
