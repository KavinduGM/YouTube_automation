# Full stack: Postgres + (one-shot) migrator + API + Worker + Dashboard + Caddy.
# After filling .env, bring everything up with:
#   docker compose up -d --build
#
# Caddy provisions free Let's Encrypt TLS automatically once your DNS records
# (DASHBOARD_DOMAIN, API_DOMAIN) point at this host's public IP.
# If you don't have a domain yet, comment out the `caddy:` service and hit
# the dashboard at http://YOUR_VPS_IP:3000 (set DASHBOARD_URL accordingly).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yt}
      POSTGRES_DB: ${POSTGRES_DB:-yt}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yt} -d ${POSTGRES_DB:-yt}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot job: runs DB migrations / schema sync, then exits 0.
  migrator:
    build: .
    image: yt-automation
    pull_policy: never
    command: ["npx", "prisma", "db", "push", "--accept-data-loss", "--skip-generate"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: yt-automation
    pull_policy: never
    command: ["node", "apps/api/dist/index.js"]
    env_file: .env
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    image: yt-automation
    pull_policy: never
    command: ["node", "apps/worker/dist/index.js"]
    env_file: .env
    volumes:
      - workertmp:/app/tmp
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  dashboard:
    image: yt-automation
    pull_policy: never
    working_dir: /app/apps/dashboard
    command: ["node", "/app/node_modules/next/dist/bin/next", "start", "-p", "3000"]
    env_file: .env
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - dashboard

volumes:
  pgdata:
  workertmp:
  caddy_data:
  caddy_config:
