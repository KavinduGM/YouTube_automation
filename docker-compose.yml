# DEBUG VERSION — dumps all env vars before starting the API so we can see
# what Dokploy actually injects. Once we know the mechanism, we'll lock it in.

services:
  migrator:
    build: .
    command:
      - "sh"
      - "-c"
      - |
        echo '======== ENV DUMP (migrator) ========'
        env | sort
        echo '======== END ENV DUMP ========'
        npx prisma db push --accept-data-loss --skip-generate
    env_file: .env
    restart: "no"

  api:
    build: .
    command:
      - "sh"
      - "-c"
      - |
        echo '======== ENV DUMP (api) ========'
        env | sort
        echo '======== END ENV DUMP ========'
        node apps/api/dist/index.js
    env_file: .env
    expose:
      - "4000"
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "apps/worker/dist/index.js"]
    env_file: .env
    volumes:
      - workertmp:/app/tmp
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  dashboard:
    build: .
    working_dir: /app/apps/dashboard
    command: ["node", "/app/node_modules/next/dist/bin/next", "start", "-p", "3000"]
    env_file: .env
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  workertmp:
