# Dokploy-friendly stack: migrator + API + Worker + Dashboard.
#
# Postgres is provided externally (Dokploy database service) — set
# DATABASE_URL in Dokploy's Environment tab.
#
# TLS + domains: handled by Dokploy's built-in Traefik. Assign domains
# to the dashboard (port 3000) and api (port 4000) services in the
# Domains tab.
#
# Every service has `build: .` so Dokploy builds an image for each.
# Docker reuses the build cache between them, so this is fast.
# Env vars come from Dokploy's Environment tab automatically.

services:
  # One-shot job: syncs DB schema, then exits 0.
  migrator:
    build: .
    command: ["npx", "prisma", "db", "push", "--accept-data-loss", "--skip-generate"]
    restart: "no"

  api:
    build: .
    command: ["node", "apps/api/dist/index.js"]
    expose:
      - "4000"
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: ["node", "apps/worker/dist/index.js"]
    volumes:
      - workertmp:/app/tmp
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  dashboard:
    build: .
    working_dir: /app/apps/dashboard
    command: ["node", "/app/node_modules/next/dist/bin/next", "start", "-p", "3000"]
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  workertmp:
