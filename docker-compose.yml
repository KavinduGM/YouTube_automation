# Dokploy-friendly stack: migrator + API + Worker + Dashboard.
#
# Postgres is provided externally (e.g. as a separate Dokploy "Database"
# service) — set DATABASE_URL in the environment to point at it.
#
# TLS + domains are handled by Dokploy's built-in Traefik proxy. Assign
# domains to the `dashboard` (port 3000) and `api` (port 4000) services
# in Dokploy's Domains UI; no Caddy needed here.
#
# For local dev or non-Dokploy hosts that need bundled Postgres + Caddy,
# see docker-compose.full.yml (or git history of this file).

services:
  # One-shot job: syncs DB schema, then exits 0.
  migrator:
    build: .
    image: yt-automation
    pull_policy: never
    command: ["npx", "prisma", "db", "push", "--accept-data-loss", "--skip-generate"]
    env_file: .env
    restart: "no"

  api:
    image: yt-automation
    pull_policy: never
    command: ["node", "apps/api/dist/index.js"]
    env_file: .env
    expose:
      - "4000"
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    image: yt-automation
    pull_policy: never
    command: ["node", "apps/worker/dist/index.js"]
    env_file: .env
    volumes:
      - workertmp:/app/tmp
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  dashboard:
    image: yt-automation
    pull_policy: never
    working_dir: /app/apps/dashboard
    command: ["node", "/app/node_modules/next/dist/bin/next", "start", "-p", "3000"]
    env_file: .env
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  workertmp:
